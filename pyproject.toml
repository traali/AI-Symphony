[project]
name = "ai-symphony"
version = "0.1.0"
description = "Autonomous AI Teams That Ship Production-Ready Code – Or Spark Your Next Big Idea"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Arto Oinonen", email = "arto@traali.fi" }
]
keywords = [
    "ai",
    "agents",
    "crewai",
    "autonomous",
    "github",
    "pull-requests",
    "code-generation",
    "llm",
    "openrouter"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "crewai",
    "crewai-tools",
    "litellm",
    "uvicorn",
    "pygithub",
    "gitpython",
    "python-dotenv",
    "langchain-openai",
    "openai",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "bandit",
    "safety",
]

[project.scripts]
symphony = "src.main:main"

[project.urls]
Homepage = "https://github.com/traali/AI-Symphony"
Repository = "https://github.com/traali/AI-Symphony"
Issues = "https://github.com/traali/AI-Symphony/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
